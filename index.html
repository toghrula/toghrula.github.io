<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toghrul Aghbabali — Finance PhD, University at Buffalo</title>
<meta name="description" content="Toghrul Aghbabali is a PhD candidate in Finance at the University at Buffalo. Research on market microstructure, generative AI in finance, and retail trading.">
<meta property="og:title" content="Toghrul Aghbabali">
<meta property="og:description" content="PhD Candidate in Finance, University at Buffalo. Market microstructure · Generative AI in finance · Retail trading.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%231f3a5f'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='34' fill='%23fbfaf7' text-anchor='middle'%3ETA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav" aria-label="Site">
  <div class="wrap">
    <a class="brand" href="#top" id="brand"></a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="menu" id="navToggle">Menu</button>
    <ul id="menu">
      <li><a href="#about">About</a></li>
      <li><a href="#research">Research</a></li>
      <li><a href="#presentations">Talks</a></li>
      <li><a href="#teaching">Teaching</a></li>
      <li><a href="#education">Education</a></li>
      <li><a href="#more">More</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </div>
</nav>

<header class="hero" id="top">
  <div class="wrap">
    <div>
      <div class="kicker" id="kicker"></div>
      <h1 id="name"></h1>
      <p class="role" id="role"></p>
      <p class="inst" id="inst"></p>
      <p class="tagline" id="tagline"></p>
      <div class="actions" id="actions"></div>
    </div>
    <img class="portrait" id="portrait" alt="">
  </div>
</header>

<main>
  <section id="about">
    <div class="wrap section-head">
      <h2>About</h2>
      <div class="section-body">
        <div class="lead" id="about-text"></div>
        <ul class="tags" id="interests"></ul>
      </div>
    </div>
  </section>

  <section id="research">
    <div class="wrap section-head">
      <h2>Research</h2>
      <div class="section-body" id="papers"></div>
    </div>
  </section>

  <section id="presentations">
    <div class="wrap section-head">
      <h2>Presentations &amp; Conferences</h2>
      <div class="section-body"><ul class="yl" id="talks"></ul></div>
    </div>
  </section>

  <section id="teaching">
    <div class="wrap section-head">
      <h2>Teaching</h2>
      <div class="section-body" id="teaching-list"></div>
    </div>
  </section>

  <section id="education">
    <div class="wrap section-head">
      <h2>Education</h2>
      <div class="section-body" id="education-list"></div>
    </div>
  </section>

  <section id="awards">
    <div class="wrap section-head">
      <h2>Honors &amp; Awards</h2>
      <div class="section-body"><ul class="yl" id="awards-list"></ul></div>
    </div>
  </section>

  <section id="experience">
    <div class="wrap section-head">
      <h2>Experience</h2>
      <div class="section-body" id="experience-list"></div>
    </div>
  </section>

  <section id="more">
    <div class="wrap section-head">
      <h2>Additional</h2>
      <div class="section-body grid2" id="more-grid"></div>
    </div>
  </section>

  <section id="contact">
    <div class="wrap section-head">
      <h2>Contact</h2>
      <div class="section-body contact" id="contact-body"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span id="copyright"></span>
    <span id="footnote"></span>
  </div>
</footer>

<script src="content.js"></script>
<script>
/* ------------------------------------------------------------------
   Rendering. You should not need to touch anything below this line —
   edit content.js instead.
   ------------------------------------------------------------------ */
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const list = (arr, fn) => (arr || []).map(fn).join("");

  const ICONS = {
    ssrn: '<svg viewBox="0 0 24 24"><path d="M4 4h16v3H4zm0 6.5h16v3H4zM4 17h10v3H4z"/></svg>',
    scholar: '<svg viewBox="0 0 24 24"><path d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3zm-6 10.6V17c0 1.7 2.7 4 6 4s6-2.3 6-4v-3.4l-6 3.3-6-3.3z"/></svg>',
    linkedin: '<svg viewBox="0 0 24 24"><path d="M4.98 3.5A2.5 2.5 0 1 1 5 8.5a2.5 2.5 0 0 1-.02-5zM3 9h4v12H3zm7 0h3.8v1.7h.1c.5-1 1.8-2 3.7-2 4 0 4.7 2.6 4.7 6V21h-4v-5.5c0-1.3 0-3-1.9-3s-2.1 1.4-2.1 2.9V21h-4z"/></svg>',
    github: '<svg viewBox="0 0 24 24"><path d="M12 .5a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.7 1.7.3 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .5z"/></svg>',
    twitter: '<svg viewBox="0 0 24 24"><path d="M18.2 2h3.4l-7.4 8.5L23 22h-6.8l-5.3-7-6.1 7H1.4l7.9-9.1L1 2h7l4.8 6.4L18.2 2zm-1.2 18h1.9L7.1 3.9H5.1L17 20z"/></svg>',
    orcid: '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM8.3 16.5H6.8V8.7h1.5v7.8zM7.6 7.7a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm3 1h3.3c3.1 0 4.5 2.2 4.5 3.9 0 2-1.6 3.9-4.5 3.9h-3.3V8.7zm1.5 1.4v5.1h1.7c2.5 0 3.1-1.9 3.1-2.6 0-1.4-.9-2.5-3.1-2.5h-1.7z"/></svg>',
    email: '<svg viewBox="0 0 24 24"><path d="M2 5h20v14H2zm2 2v.5l8 5 8-5V7l-8 5-8-5z"/></svg>',
    link: '<svg viewBox="0 0 24 24"><path d="M10.6 13.4a1 1 0 0 1 0-1.4l2.8-2.8a1 1 0 1 1 1.4 1.4L12 13.4a1 1 0 0 1-1.4 0zm-2.8 2.8a3 3 0 0 1 0-4.2l1.4-1.4-1.4-1.4-1.4 1.4a5 5 0 0 0 7 7l1.4-1.4-1.4-1.4-1.4 1.4a3 3 0 0 1-4.2 0zm8.4-8.4a3 3 0 0 1 0 4.2l-1.4 1.4 1.4 1.4 1.4-1.4a5 5 0 0 0-7-7L9.2 7.8l1.4 1.4 1.4-1.4a3 3 0 0 1 4.2 0z"/></svg>',
  };

  // ---- hero ----
  document.title = `${SITE.name} — ${SITE.title}`;
  $("brand").innerHTML = esc(SITE.name) + "<span>" + esc(SITE.title) + "</span>";
  $("kicker").textContent = SITE.location || "";
  $("name").textContent = SITE.name;
  $("role").textContent = SITE.title;
  $("inst").textContent = SITE.institution;
  $("tagline").textContent = SITE.tagline || "";
  $("tagline").hidden = !SITE.tagline;

  let actions = "";
  if (SITE.cvFile) actions += `<a class="btn primary" href="${esc(SITE.cvFile)}" target="_blank" rel="noopener">Curriculum Vitae</a>`;
  if (SITE.email)  actions += `<a class="btn" href="mailto:${esc(SITE.email)}">Email</a>`;
  const links = (SITE.links || []).filter(l => l.url);
  if (links.length) actions += `<span class="iconlinks">` + list(links, l =>
    `<a href="${esc(l.url)}" target="_blank" rel="noopener" title="${esc(l.label)}" aria-label="${esc(l.label)}">${ICONS[l.icon] || ICONS.link}</a>`) + `</span>`;
  $("actions").innerHTML = actions;

  const hero = document.querySelector(".hero"), img = $("portrait");
  if (SITE.photo) {
    img.src = SITE.photo; img.alt = `Portrait of ${SITE.name}`;
    img.onerror = () => { img.remove(); hero.classList.add("no-photo"); };
  } else { img.remove(); hero.classList.add("no-photo"); }

  // ---- about ----
  $("about-text").innerHTML = list(SITE.about, p => `<p>${p}</p>`);
  $("interests").innerHTML = list(SITE.interests, i => `<li>${esc(i)}</li>`);

  // ---- research ----
  $("papers").innerHTML = list(SITE.papers, p => {
    const title = p.ssrn ? `<a href="${esc(p.ssrn)}" target="_blank" rel="noopener">${esc(p.title)}</a>` : esc(p.title);
    const meta = [p.coauthors, p.journal, p.date].filter(Boolean).map(esc).join('<span class="sep">·</span>');
    return `<article class="paper">
      <h3>${title}${p.status ? `<span class="status">${esc(p.status)}</span>` : ""}</h3>
      <div class="meta">${meta}</div>
      ${p.award ? `<div class="award">${esc(p.award)}</div>` : ""}
      ${p.abstract ? `<details class="abs"><summary>Abstract</summary><p>${esc(p.abstract)}</p></details>` : ""}
      ${(p.notes || []).length ? `<ul class="notes">${list(p.notes, n => `<li>${n}</li>`)}</ul>` : ""}
      ${p.ssrn || p.pdf ? `<div class="plinks">${p.ssrn ? `<a href="${esc(p.ssrn)}" target="_blank" rel="noopener">SSRN</a>` : ""}${p.pdf ? `<a href="${esc(p.pdf)}" target="_blank" rel="noopener">PDF</a>` : ""}</div>` : ""}
    </article>`;
  });

  // ---- talks / awards ----
  const yearList = (arr) => list(arr, x => `<li><span class="yr">${esc(x.year)}</span><span>${x.text}</span></li>`);
  $("talks").innerHTML = yearList(SITE.presentations);
  $("awards-list").innerHTML = yearList(SITE.awards);

  // ---- teaching ----
  $("teaching-list").innerHTML = list(SITE.teaching, t => `<div class="entry">
      <div><h3>${esc(t.institution)}</h3><div class="sub">${esc(t.role)}</div></div>
      <div class="when">${esc(t.period)}</div>
      ${(t.courses || []).length ? `<ul class="courses">${list(t.courses, c => `<li>${esc(c)}</li>`)}</ul>` : ""}
    </div>`);

  // ---- education ----
  $("education-list").innerHTML = list(SITE.education, e => `<div class="entry">
      <div><h3>${esc(e.degree)}</h3><div class="sub">${esc(e.school)}${e.place ? ", " + esc(e.place) : ""}</div></div>
      <div class="when">${esc(e.year)}</div>
      ${(e.notes || []).length ? `<ul class="notes">${list(e.notes, n => `<li>${esc(n)}</li>`)}</ul>` : ""}
    </div>`);

  // ---- experience ----
  $("experience-list").innerHTML = list(SITE.experience, x => `<div class="entry">
      <div><h3>${esc(x.role)}</h3><div class="sub">${esc(x.org)}${x.place ? ", " + esc(x.place) : ""}</div></div>
      <div class="when">${esc(x.period)}</div>
      ${x.text ? `<ul class="notes"><li>${esc(x.text)}</li></ul>` : ""}
    </div>`);

  // ---- more ----
  const block = (h, arr, fn) => (arr || []).length ? `<div><h3>${h}</h3><ul>${list(arr, fn)}</ul></div>` : "";
  $("more-grid").innerHTML =
    block("Writing &amp; Media", SITE.media, m => `<li class="media"><a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.text)}</a><span class="outlet">${esc(m.outlet)}</span></li>`) +
    block("Professional Memberships", SITE.memberships, s => `<li>${esc(s)}</li>`) +
    block("Certifications", SITE.certifications, s => `<li>${esc(s)}</li>`) +
    block("Service &amp; Leadership", SITE.service, s => `<li>${esc(s)}</li>`) +
    ((SITE.skills||[]).length ? `<div><h3>Technical Skills</h3><ul class="tags" style="margin-top:0">${list(SITE.skills, s => `<li>${esc(s)}</li>`)}</ul></div>` : "") +
    ((SITE.hobbies||[]).length ? `<div><h3>Outside Work</h3><ul class="tags" style="margin-top:0">${list(SITE.hobbies, s => `<li>${esc(s)}</li>`)}</ul></div>` : "");
  $("more-grid").querySelectorAll(".media").forEach(li => li.parentElement.classList.add("media"));

  // ---- contact ----
  $("contact-body").innerHTML = `
    <p class="email"><a href="mailto:${esc(SITE.email)}">${esc(SITE.email)}</a></p>
    <p>${esc(SITE.institution)}<br>${esc(SITE.location)}</p>`;

  // ---- footer ----
  $("copyright").textContent = `© ${new Date().getFullYear()} ${SITE.name}`;
  $("footnote").textContent = SITE.footerNote || "";

  // hide empty sections
  document.querySelectorAll("main section").forEach(s => {
    const body = s.querySelector(".section-body");
    if (body && !body.innerHTML.trim()) s.remove();
  });

  // ---- nav behaviour ----
  const toggle = $("navToggle"), menu = $("menu");
  toggle.addEventListener("click", () => {
    const open = menu.classList.toggle("open");
    toggle.setAttribute("aria-expanded", open);
  });
  menu.addEventListener("click", e => { if (e.target.tagName === "A") menu.classList.remove("open"); });

  const navLinks = [...menu.querySelectorAll("a")];
  const targets = navLinks.map(a => document.querySelector(a.getAttribute("href"))).filter(Boolean);
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        navLinks.forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + en.target.id));
      }
    });
  }, { rootMargin: "-40% 0px -55% 0px" });
  targets.forEach(t => io.observe(t));
})();
</script>
</body>
</html>
